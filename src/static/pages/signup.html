<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>tkMusic | Signup</title>
    </head>
    <body>
        <form id="signupForm">
            <label for="username">Username:</label><br />
            <input
                type="text"
                name="username"
                id="username"
                required
            />
            <br />
            <label for="password">Password:</label><br />
            <input
                type="text"
                name="password"
                id="password"
                required
            />
            <br />
            <input
                type="submit"
                name="Submit"
            />
        </form>
        <script type="module" src="../scripts/dist/index.js"></script>
    </body>
</html>
